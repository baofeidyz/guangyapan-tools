name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Test and build
        run: npm run check

      - name: Upload userscript artifact
        uses: actions/upload-artifact@v4
        with:
          name: guangya-tmdb-renamer-${{ github.sha }}
          path: dist/guangya-tmdb-renamer.user.js
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Verify release version and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          USERSCRIPT_VERSION="$(sed -n 's|^// @version[[:space:]]*||p' src/userscript.meta.txt)"
          TAG_VERSION="${RELEASE_TAG#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"
          test "$USERSCRIPT_VERSION" = "$TAG_VERSION"
          npm run build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/guangya-tmdb-renamer.user.js
          --verify-tag
          --generate-notes
          --title "${{ github.ref_name }}"
